<!DOCTYPE html>
<html>

<head>

    <title>CRM Login</title>

    <style>

        body{

            font-family: Arial, sans-serif;

            background:#f5f7fa;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

            margin:0;

        }

        .login-box{

            background:white;

            padding:40px;

            border-radius:12px;

            box-shadow:0px 0px 15px rgba(0,0,0,0.1);

            width:350px;

            text-align:center;

        }

        input{

            width:100%;

            padding:12px;

            margin:10px 0;

            border:1px solid #ddd;

            border-radius:6px;

            box-sizing:border-box;

        }

        button{

            width:100%;

            padding:12px;

            border:none;

            border-radius:6px;

            background:#2c3e50;

            color:white;

            font-size:16px;

            cursor:pointer;

        }

        button:hover{

            background:#1f2d3d;

        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>CRM Login</h2>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">

            Login

        </button>

    </form>

</div>

</body>

</html>
