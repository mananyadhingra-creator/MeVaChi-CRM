<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeVaChi CRM — Sign In</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">
</head>

<body class="mevachi-login">

<div class="mevachi-login-wrap">

    <div class="mevachi-login-brand">

        <div class="brand-icon">
            <img src="{{ url_for('static', filename='images/favicon.png') }}"
                 alt="MeVaChi Logo">
        </div>

        <h1>MeVaChi Solutions</h1>
        <p>Clean Air · Engineered</p>

    </div>

    <div class="mevachi-login-box">
        <h2>Sign in to your workspace</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <div class="password-wrapper">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Password"
                    required>

                <i
                    class="bi bi-eye password-toggle"
                    onclick="togglePassword('loginPassword', this)">
                </i>

            </div>
            <button type="submit"><i class="bi bi-box-arrow-in-right"></i> Sign In</button>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>

</body>

</html>
