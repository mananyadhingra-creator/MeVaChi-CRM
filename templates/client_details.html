<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <h2 class="text-center mb-4">

        Client Details

    </h2>

    <!-- BASIC CLIENT INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Basic Client Information

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Client ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.client_id }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Client Name

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.client_name }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Monitor Present

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.monitor_present }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Property Type

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.property_type }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    State

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.state }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Address

            </label>

            <textarea class="form-control"
                      rows="3"
                      readonly>{{ client.address }}</textarea>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Email ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.mail_id }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Mobile Number

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.mobile_no }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Location Link

            </label>

            <input type="text"
                   class="form-control"
                   value="{{ client.location_link }}"
                   readonly>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Nearest Metro Station

            </label>

            <input type="text"
                   class="form-control"
                   value="{{ client.nearest_metrostation }}"
                   readonly>

        </div>

    </div>

    <!-- INSTALLATION INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Installation Information

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Product

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.product }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Installation Date

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.installation_date }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Activation Date

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.activation_date }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Filter Colour

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.filter_colour }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    No Of Units Installed

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.no_of_units_installed }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Solution Working

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.solution_working }}"
                       readonly>

            </div>

        </div>

    </div>
    <!-- CMC INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            CMC Information

        </h4>

        <div class="row">

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    CMC Applicable

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.cmc_applicable }}"
                       readonly>

            </div>

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    CMC Due Days

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.cmc_due_days }}"
                       readonly>

            </div>

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    CMC Due

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.cmc_due }}"
                       readonly>

            </div>

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    CMC Amount

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.cmc_amount }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Next CMC Renewal Date

            </label>

            <input type="text"
                   class="form-control"
                   value="{{ client.next_cmc_renewal_date }}"
                   readonly>

        </div>

    </div>

    <!-- SERVICE INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Service Information

        </h4>

        <div class="row">

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    Last Service Days

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.last_service_days }}"
                       readonly>

            </div>

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    Last Service Date

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.last_service_date }}"
                       readonly>

            </div>

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    Service Interval Days

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.service_interval_days }}"
                       readonly>

            </div>

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    Service Due

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.service_due }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Filter Clean

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.filter_clean }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Service For

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.service_for }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    No Of Filters Replaced

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.no_of_filters_replaced }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Pre Service Message

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.pre_service_msg }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Post Service Message

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.post_service_msg }}"
                       readonly>

            </div>

        </div>

    </div>

    <!-- REMARKS -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Remarks

        </h4>

        <textarea class="form-control"
                  rows="4"
                  readonly>{{ client.remark }}</textarea>

    </div>

    <!-- LINKS -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Record Links

        </h4>

        <div class="row">

            <div class="col-md-6">

                <label class="form-label">

                    Proposal ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.proposal_id }}"
                       readonly>

            </div>

            <div class="col-md-6">

                <label class="form-label">

                    Invoice ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ client.invoice_id }}"
                       readonly>

            </div>

        </div>

    </div>

    <div class="text-center mb-5">

        <a href="/add-client"
           class="btn btn-dark">

            Back To Clients

        </a>


    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
