<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Edit User

        </h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Username

                    </label>

                    <input type="text"
                           value="{{ user.username }}"
                           class="form-control"
                           readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Role

                    </label>

                    <select name="role"
                            class="form-select">

                        <option value="ADMIN"
                            {% if user.role == 'ADMIN' %}
                            selected
                            {% endif %}>

                            ADMIN

                        </option>

                        <option value="SALES"
                            {% if user.role == 'SALES' %}
                            selected
                            {% endif %}>

                            SALES

                        </option>

                        <option value="COMMERCIALS"
                            {% if user.role == 'COMMERCIALS' %}
                            selected
                            {% endif %}>

                            COMMERCIALS

                        </option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input type="text"
                           name="full_name"
                           value="{{ user.full_name }}"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input type="email"
                           name="email"
                           value="{{ user.email }}"
                           class="form-control">

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Active Status

                </label>

                <select name="is_active"
                        class="form-select">

                    <option value="YES"
                        {% if user.is_active == 'YES' %}
                        selected
                        {% endif %}>

                        YES

                    </option>

                    <option value="NO"
                        {% if user.is_active == 'NO' %}
                        selected
                        {% endif %}>

                        NO

                    </option>

                </select>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Update User

                </button>

                <a href="{{ url_for('manage_users') }}"
                   class="btn btn-secondary">

                    Back

                </a>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
