<!DOCTYPE html>
<html>

<head>

    <title>Add User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            User Management

        </h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Username

                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Password

                    </label>

                    <input type="text"
                           name="password"
                           class="form-control"
                           required>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input type="text"
                           name="full_name"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input type="email"
                           name="email"
                           class="form-control">

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Role

                </label>

                <select name="role"
                        class="form-select">

                    <option value="ADMIN">

                        ADMIN

                    </option>

                    <option value="SALES">

                        SALES

                    </option>

                    <option value="COMMERCIALS">

                        COMMERCIALS

                    </option>

                </select>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Save User

                </button>

                <a href="{{ url_for('manage_users') }}"
                   class="btn btn-secondary">

                    Back

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
