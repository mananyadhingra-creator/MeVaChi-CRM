<!DOCTYPE html>
<html>

<head>

    <title>Drawing Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">
    <a href="javascript:history.back()"
       class="btn btn-outline-secondary">

        Back

    </a>
    <a href="/dashboard"
        class="btn btn-dark">

        Back To Dashboard

    </a>    
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Drawing Details

        </h2>

        <table class="table table-bordered">

            <tr>

                <th>Drawing ID</th>

                <td>{{ drawing.drawing_id }}</td>

            </tr>

            <tr>

                <th>Name</th>

                <td>{{ drawing.name }}</td>

            </tr>

            <tr>

                <th>Address</th>

                <td>{{ drawing.address }}</td>

            </tr>

            <tr>

                <th>Iteration Number</th>

                <td>{{ drawing.iterations }}</td>

            </tr>

            <tr>

                <th>MOCA</th>

                <td>{{ drawing.moca }}</td>

            </tr>

            <tr>

                <th>Drawing PDF</th>

                <td>

                    {% if drawing.drawing_pdf %}

                    <a href="{{ url_for('static',
                                         filename=drawing.drawing_pdf) }}"
                       target="_blank">

                        Open Drawing PDF

                    </a>

                    {% else %}

                    No PDF Uploaded

                    {% endif %}

                </td>

            </tr>

        </table>



    </div>

</div>

</body>

</html>
