<!DOCTYPE html>
<html>

<head>

    <title>

        Sales Department

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#f5f7fa;

        }

        .employee-card{

            text-decoration:none;

            color:#212529;

        }

        .employee-card .card{

            min-height: 100px;
            
            transition:.3s;

            border:none;

            box-shadow:0 2px 10px rgba(
                0,0,0,.08
            );

        }

        .employee-card .card:hover{

            transform:translateY(
                -4px
            );

        }

    </style>

</head>

<body>

<div class="container py-5">
    <a href="javascript:history.back()"
       class="btn btn-outline-secondary">

        Back

    </a>
    <a href="/dashboard"
        class="btn btn-dark">

        Back To Dashboard

    </a>    
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Sales Department

        </h2>

    

    </div>
    
    <div class="row g-4">

        {% for user in sales_users %}

        <div class="col-lg-3 col-md-4 col-sm-6 mb-4">

            <a href="{{ url_for(
                'sales_employee',
                username=user.username
            ) }}"
               class="employee-card">

                <div class="card">

                    <div class="card-body text-center">

                        <h5>

                            {{ user.full_name }}

                        </h5>

                        <p class="text-muted mb-0">

                            Sales Executive

                        </p>

                    </div>

                </div>

            </a>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
