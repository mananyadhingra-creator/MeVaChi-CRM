<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Department</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container py-4">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">Back</a>

        <a href="/dashboard"
           class="btn btn-dark">Back to Dashboard</a>

    </div>

    <div class="mevachi-page-header mb-3">

        <h2>Sales Department</h2>

        <p class="page-desc mb-0">{{ sales_users|length }} team member{% if sales_users|length != 1 %}s{% endif %} · Select to view records</p>

    </div>

    <div class="row mevachi-employee-grid">

        {% for user in sales_users %}

        <div class="col-xl-3 col-lg-4 col-md-6 col-sm-6">

            <a href="{{ url_for('sales_employee', username=user.username) }}"
               class="employee-card">

                <div class="card mevachi-employee-card h-100">

                    <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">

                        <div class="mevachi-avatar" aria-hidden="true">
                            <i class="bi bi-person-fill"></i>
                        </div>

                        <h5 class="employee-name mt-2 mb-0">{{ user.full_name }}</h5>

                        <p class="employee-role mb-0">Sales Executive</p>

                        <p class="employee-meta mb-0 mt-1">View leads, proposals &amp; pipeline</p>

                    </div>

                </div>

            </a>

        </div>

        {% endfor %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
