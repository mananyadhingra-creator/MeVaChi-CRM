<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Lead</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Lead Management
        </h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Lead Name
                    </label>

                    <input type="text"
                           name="name"
                           value="{{lead.name}}"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Lead Source / Reference
                    </label>

                    <input type="text"
                           name="reference"
                           value="{{lead.reference}}"
                           class="form-control">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input type="text"
                           name="location"
                           value="{{lead.location}}"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"
                           name="phone"
                           value="{{lead.phone}}"
                           class="form-control">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Co-Host
                    </label>

                    <select name="cohost" class="form-select">

                        <option value="">None</option>

                        {% for user in owners %}

                            {% if user.username != session['username'] %}

                            <option
                                value="{{ user.username }}"
                                {% if shared_user and shared_user.cohost_username == user.username %}selected{% endif %}
                            >
                                {{ user.full_name }} ({{ user.role }})
                            </option>

                            {% endif %}

                        {% endfor %}

                    </select>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Response
                </label>

                <textarea name="responses"
                          class="form-control">{{ lead.responses }}</textarea>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Date of 1st Followup
                    </label>

                    <input type="date"
                           name="date_of_1st_followup"
                           value="{{lead.date_of_1st_followup}}"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Next To Call
                    </label>

                    <input type="date"
                           name="next_to_call"
                           value="{{lead.next_to_call}}"
                           class="form-control"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Next Action

                </label>

                <textarea name="next_action"
                          rows="3"
                          class="form-control">{{ lead.next_action }}</textarea>

            </div>
            
            <div class="mb-3">

                <label class="form-label">
                    Recent Remarks
                </label>

                <textarea name="recent"
                          class="form-control">{{ lead.recent }}</textarea>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Update Lead

                </button>
                

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
