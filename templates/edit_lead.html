<!DOCTYPE html>
<html>

<head>

    <title>Edit Lead</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Lead Management
        </h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Lead Name
                    </label>

                    <input type="text"
                           name="name"
                           value="{{ lead.name }}"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Lead Source / Reference
                    </label>

                    <input type="text"
                           name="reference"
                           value="{{ lead.reference }}">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input type="text"
                           name="location"
                           value="{{ lead.location }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"
                           name="phone"
                           value="{{ lead.phone }}">

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Response
                </label>

                <textarea
                    name="responses">{{ lead.responses }}</textarea>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Date of 1st Followup
                    </label>

                    <input type="date"
                           name="date_of_1st_followup"
                           value="{{ lead.date_of_1st_followup }}"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Next To Call
                    </label>

                    <input type="date"
                           name="next_to_call"
                           value="{{ lead.next_to_call }}"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Recent Remarks
                </label>

                <textarea
                    name="recent">{{ lead.recent }}</textarea>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Update Lead

                </button>

            </div>

        </form>

    </div>


</div>

</body>

</html>
