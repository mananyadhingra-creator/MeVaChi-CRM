<!DOCTYPE html>
<html>

<head>

    <title>Add Lead</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <a href="javascript:history.back()"
       class="btn btn-outline-secondary">

        Back

    </a>
    <a href="/dashboard"
        class="btn btn-dark">

        Back To Dashboard

    </a>    
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Lead Management
        </h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Lead Name
                    </label>

                    <input type="text"
                           name="name"
                           value="{{lead.name}}"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Lead Source / Reference
                    </label>

                    <input type="text"
                           name="reference"
                           value="{{lead.reference}}"
                           class="form-control">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input type="text"
                           name="location"
                           value="{{lead.location}}"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"
                           name="phone"
                           value="{{lead.phone}}"
                           class="form-control">

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Response
                </label>

                <textarea name="responses"
                          class="form-control">{{ lead.response }}</textarea>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Date of 1st Followup
                    </label>

                    <input type="date"
                           name="date_of_1st_followup"
                           value="{{lead.date_of_1st_followup}}"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Next To Call
                    </label>

                    <input type="date"
                           name="next_to_call"
                           value="{{lead.next_to_call}}"
                           class="form-control"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Recent Remarks
                </label>

                <textarea name="recent"
                          class="form-control">{{ lead.recent }}</textarea>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Update Lead

                </button>
                

    </div>

</div>

</body>

</html>
