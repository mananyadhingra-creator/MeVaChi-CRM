<!DOCTYPE html>
<html>

<head>

    <title>

        Delete Request

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <a href="javascript:history.back()"
       class="btn btn-outline-secondary">

        Back

    </a>
    <a href="/dashboard"
        class="btn btn-dark">

        Back To Dashboard

    </a>    
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Request Deletion

        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    Module

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ module }}"
                       readonly>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Record ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ record_id }}"
                       readonly>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Reason

                </label>

                <textarea name="reason"
                          class="form-control"
                          required></textarea>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Submit Request

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
