<!DOCTYPE html>
<html>

<head>

    <title>Activity Logs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <a href="/dashboard"
        class="btn btn-secondary mb-3">

        Back To Dashboard

    </a>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Activity Logs

        </h2>
        <form method="GET"
              class="mb-3">

            <div class="input-group">

                <input type="text"
                       name="search"
                       value="{{ search or '' }}"
                       placeholder="Search logs..."
                       class="form-control">

                <button type="submit"
                        class="btn btn-dark">

                    Search

                </button>

                <a href="{{ url_for('activity_logs') }}"
                   class="btn btn-secondary">

                    Clear

                </a>

            </div>

        </form>
        <table class="table table-bordered table-striped">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Module</th>

                    <th>Record ID</th>

                    <th>Action</th>

                    <th>User</th>

                    <th>Date & Time</th>

                </tr>

            </thead>

            <tbody>

                {% for log in logs %}

                <tr>

                    <td>{{ log.log_id }}</td>

                    <td>{{ log.module_name }}</td>

                    <td>{{ log.record_id }}</td>

                    <td>{{ log.action }}</td>

                    <td>{{ log.performed_by }}</td>

                    <td>{{ log.performed_on }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
