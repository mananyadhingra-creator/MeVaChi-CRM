<!DOCTYPE html>
<html>

<head>

    <title>Visit Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-end gap-1">
        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>
        <a href="/dashboard"
           class="btn btn-dark">

            Back To Dashboard

        </a>  
    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Edit Visit

        </h2>

        <form method="POST">

            <!-- SELECT MEETING -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Select Meeting

                </h4>

                <select name="meeting_id">

                    <option value="">
                        Select Meeting
                    </option>

                    {% for meeting in meetings %}

                    <option
                        value="{{ meeting.meeting_id }}"

                        data-company="{{ meeting.firm_name }}"

                        data-person="{{ meeting.name }}"

                        data-designation="{{ meeting.designation }}"

                        data-contact="{{ meeting.contact_no }}"

                        data-address="{{ meeting.address }}"

                        data-state="{{ meeting.state }}"

                        {% if meeting.meeting_id == visit.meeting_id %}
                            selected
                        {% endif %}>

                        {{ meeting.name }}

                    </option>

                    {% endfor %}

                </select>
            </div>

            <!-- VISIT DETAILS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Visit Details

                </h4>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Company Name

                        </label>

                        <input type="text"
                               id="company_name"
                               name="company_name"
                               value="{{ visit.company_name }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Person Name

                        </label>

                        <input type="text"
                               id="person_name"
                               name="person_name"
                               value="{{ visit.person_name }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Designation

                        </label>

                        <input type="text"
                               id="designation"
                               name="designation"
                               value="{{ visit.designation }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Contact No

                        </label>

                        <input type="text"
                               id="contact_no"
                               name="contact_no"
                               value="{{ visit.contact_no }}"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Address

                    </label>

                    <textarea id="address"
                              name="address"
                              rows="3"
                              class="form-control">{{ visit.address }}</textarea>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            State

                        </label>

                        <input type="text"
                               id="state"
                               name="state"
                               value="{{ visit.state }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Region

                        </label>

                        <input type="text"
                               name="region"
                               value="{{ visit.region }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            ABC

                        </label>

                        <input type="text"
                               name="abc"
                               value="{{ visit.abc }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Visit Date

                        </label>

                        <input type="date"
                               name="visit_date"
                               value="{{ visit.visit_date }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Leads Generated

                        </label>

                        <input type="number"
                               name="leads_generated"
                               value="{{ visit.leads_generated }}"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Brief

                    </label>

                    <textarea name="brief"
                              rows="3"
                              class="form-control">{{ visit.brief }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        M2

                    </label>

                    <textarea name="m2"
                              rows="3"
                              class="form-control">{{ visit.m2 }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        M3

                    </label>

                    <textarea name="m3"
                              rows="3"
                              class="form-control">{{ visit.m3 }}</textarea>

                </div>

            </div>
                        <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Save Visit

                </button>


            </div>

        </form>

    </div>
  

</div>


</script>

</body>

</html>
