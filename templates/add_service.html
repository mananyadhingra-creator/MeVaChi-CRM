<!DOCTYPE html>
<html>

<head>

    <title>Add Service</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>

            Add Service

        </h2>

        <h4>

            {{ client.client_name }}

        </h4>

        <hr>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Service Date</label>

                    <input type="date"
                           name="service_date"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Service Of</label>

                    <input type="text"
                           name="service_of"
                           class="form-control">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>No Of Filters</label>

                    <input type="number"
                           name="no_of_filters"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Serviced By</label>

                    <input type="text"
                           name="serviced_by"
                           class="form-control">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Controller Changed</label>

                    <select name="controller_changed"
                            class="form-select">

                        <option>YES</option>

                        <option>NO</option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Fan Changed</label>

                    <select name="fan_changed"
                            class="form-select">

                        <option>YES</option>

                        <option>NO</option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Pre Service Message</label>

                    <select name="pre_service_msgd"
                            class="form-select">

                        <option>YES</option>

                        <option>NO</option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Post Service Report Sent</label>

                    <select name="post_service_report_sent"
                            class="form-select">

                        <option>YES</option>

                        <option>NO</option>

                    </select>

                </div>

            </div>

            <div class="mb-3">

                <label>Miscellaneous Messages</label>

                <textarea name="miscellaneous_messages"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label>Tips And Tricks</label>

                <textarea name="tips_and_tricks"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label>Referrals Program</label>

                <input type="text"
                       name="referrals_program"
                       class="form-control">

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>News Sent</label>

                    <select name="news_sent"
                            class="form-select">

                        <option>YES</option>

                        <option>NO</option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Communication Date</label>

                    <input type="date"
                           name="communication_date"
                           class="form-control">

                </div>

            </div>

            <div class="mb-3">

                <label>Remark</label>

                <textarea name="remark"
                          class="form-control"></textarea>

            </div>

            <button type="submit"
                    class="btn btn-dark">

                Save Service

            </button>

        </form>

    </div>

</div>

</body>

</html>
