<!DOCTYPE html>
<html>

<head>

    <title>Invoice Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <a href="javascript:history.back()"
       class="btn btn-outline-secondary">

        Back

    </a>
    <a href="/dashboard"
        class="btn btn-dark">

        Back To Dashboard

    </a>    
    <h2 class="text-center mb-4">

        Invoice Details

    </h2>

    <!-- BASIC INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Basic Information

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Invoice ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.invoice_id }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Invoice Number

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.invoice_no }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Date Of Invoice

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.doi }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Client Name

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.name }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    GST Number

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.gst_no }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Product Sold

            </label>

            <input type="text"
                   class="form-control"
                   value="{{ invoice.product_sold }}"
                   readonly>

        </div>

    </div>

    <!-- PRODUCT INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Product Information

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Units

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.total_units }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Price Of Units

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.price_of_units }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    First Year CMC

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.first_year_cmc }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Installation

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.installation }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Sensor

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.total_sensor }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Sensor Cost

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.sensor_cost }}"
                       readonly>

            </div>

        </div>
                <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Revenue

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.revenue }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Total Revenue

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.total_revenue }}"
                       readonly>

            </div>

        </div>

    </div>

    <!-- REVENUE INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Revenue Summary

        </h4>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Revenue (Without GST)

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.revenue }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Total Revenue (With GST)

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.total_revenue }}"
                       readonly>

            </div>

        </div>

    </div>

    <div class="card shadow p-4 mb-4">

        <h4>

            Invoice PDF

        </h4>

        {% if invoice.invoice_pdf %}

        <a href="{{ url_for(
                        'static',
                        filename=invoice.invoice_pdf
                    ) }}"
            target="_blank"
            class="btn btn-dark">

            View Invoice PDF

        </a>

        {% else %}

            <p>

                No PDF Uploaded

            </p>

        {% endif %}

    </div>


</div>

</body>

</html>
