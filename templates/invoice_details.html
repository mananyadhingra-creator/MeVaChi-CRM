<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <h2 class="text-center mb-4">

        Invoice Details

    </h2>

    <!-- BASIC INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Basic Information

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Invoice ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.invoice_id }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Invoice Number

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.invoice_no }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Date Of Invoice

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.doi }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Client Name

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.name }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    GST Number

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.gst_no }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Product Sold

            </label>

            <input type="text"
                   class="form-control"
                   value="{{ invoice.product_sold }}"
                   readonly>

        </div>

    </div>

    <!-- PRODUCT INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Product Information

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Units

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.total_units }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Price Of Units

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.price_of_units }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    First Year CMC

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.first_year_cmc }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Installation

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.installation }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Sensor

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.total_sensor }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Sensor Cost

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.sensor_cost }}"
                       readonly>

            </div>

        </div>
                <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Revenue

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.revenue }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Total Revenue

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.total_revenue }}"
                       readonly>

            </div>

        </div>

    </div>

    <!-- REVENUE INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Revenue Summary

        </h4>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Revenue (Without GST)

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.revenue }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Total Revenue (With GST)

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ invoice.total_revenue }}"
                       readonly>

            </div>

        </div>

    </div>

    <div class="card shadow p-4 mb-4">

        <h4>

            Invoice Files

        </h4>

        {% if invoice.files %}

        <div class="table-responsive">
        <table class="table table-bordered table-striped">

            <thead>

                <tr>

                    <th>

                        File Name

                    </th>

                    <th width="250">

                        Actions

                    </th>

                </tr>

            </thead>

            <tbody>

                {% for file in invoice.files %}

                <tr>

                    <td>

                        {{ file.file_name }}

                    </td>

                    <td>

                        <a href="{{ url_for(
                                        'static',
                                        filename=file.file_path
                                    ) }}"
                           target="_blank"
                           class="btn btn-outline-primary btn-sm mevachi-icon-btn" title="View" aria-label="View"><i class="bi bi-eye"></i></a>

                        <a href="{{ url_for(
                                        'static',
                                        filename=file.file_path
                                    ) }}"
                           download
                           class="btn btn-outline-success btn-sm mevachi-icon-btn" title="Download" aria-label="Download"><i class="bi bi-download"></i></a>

                        <a href="/delete-invoice-file/{{ file.file_id }}"
                           class="btn btn-outline-danger btn-sm mevachi-icon-btn" title="Delete" aria-label="Delete" onclick="return confirm(
                                'Delete this file?'
                           )"><i class="bi bi-trash"></i></a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>
        </div>

        {% else %}

            <div class="alert alert-warning">

                No files uploaded.

            </div>

        {% endif %}

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
