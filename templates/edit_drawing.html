<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drawing Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-4">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Edit Drawing

        </h2>

        <form method="POST"
              enctype="multipart/form-data">



            <!-- DRAWING DETAILS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Drawing Details

                </h4>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Name

                        </label>

                        <input type="text"
                               id="name"
                               name="name"
                               value="{{ drawing.name }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Iteration Number

                        </label>

                        <input type="number"
                               name="iterations"
                               value="{{ drawing.iterations }}"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Address

                    </label>

                    <textarea id="address"
                              name="address"
                              rows="3"
                              class="form-control">{{ drawing.address }}</textarea>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            MOCA

                        </label>

                        <input type="text"
                               name="moca"
                               value="{{ drawing.moca }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>

                            Current Drawing PDF

                        </label>

                        <br>

                        {% if drawing.drawing_pdf %}

                        <a href="{{ url_for(
                            'static',
                            filename=drawing.drawing_pdf
                        ) }}"
                        target="_blank">

                            View Current PDF

                        </a>

                        {% else %}

                        <span class="text-muted">

                            No PDF Uploaded

                        </span>

                        {% endif %}

                        <br><br>

                    <input
                        type="file"
                        name="drawing_files"
                        class="form-control"
                        multiple>

                </div>

            </div>
            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Update Drawing

                </button>


            </div>

        </form>

    </div>

    

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
