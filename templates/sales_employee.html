<!DOCTYPE html>
<html>

<head>

    <title>

        {{ user.full_name }}

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#f5f7fa;

        }

        .module-link{

            text-decoration:none;

            color:inherit;

        }

        .module-card{

            border:none;

            border-radius:12px;

            box-shadow:0 2px 10px rgba(
                0,0,0,.08
            );

            transition:.3s;

        }

        .module-card:hover{

            transform:translateY(
                -4px
            );

        }

    </style>

</head>

<body>

<div class="container py-5">
    <div class="d-flex justify-content-end gap-1">
        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>
        <a href="/dashboard"
           class="btn btn-dark">

            Back To Dashboard

        </a>  
    </div>    
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="mb-1">

                {{ user.full_name }}

            </h2>

            <small class="text-muted">

                Sales Executive

            </small>

        </div>


    </div>

    <div class="row g-4">

        <div class="col-md-3">

            <a href="{{ url_for(
                'employee_leads',
                username=user.username
            ) }}"
               class="module-link">

                <div class="card module-card">

                    <div class="card-body text-center">

                        <h5>

                            Leads

                        </h5>

                        <h3>

                            {{ lead_count }}

                        </h3>

                    </div>

                </div>

            </a>

        </div>

        <div class="col-md-3">

            <a href="{{ url_for(
                'employee_meetings',
                username=user.username
            ) }}"
               class="module-link">

                <div class="card module-card">

                    <div class="card-body text-center">

                        <h5>

                            Meetings

                        </h5>

                        <h3>

                            {{ meeting_count }}

                        </h3>

                    </div>

                </div>

            </a>

        </div>

        <div class="col-md-3">

            <a href="{{ url_for(
                'employee_visits',
                username=user.username
            ) }}"
               class="module-link">

                <div class="card module-card">

                    <div class="card-body text-center">

                        <h5>

                            Visits

                        </h5>

                        <h3>

                            {{ visit_count }}

                        </h3>

                    </div>

                </div>

            </a>

        </div>

        <div class="col-md-3">

            <a href="{{ url_for(
                'employee_drawings',
                username=user.username
            ) }}"
               class="module-link">

                <div class="card module-card">

                    <div class="card-body text-center">

                        <h5>

                            Drawings

                        </h5>

                        <h3>

                            {{ drawing_count }}

                        </h3>

                    </div>

                </div>

            </a>

        </div>

        <div class="col-md-3">

            <a href="{{ url_for(
                'employee_proposals',
                username=user.username
            ) }}"
               class="module-link">

                <div class="card module-card">

                    <div class="card-body text-center">

                        <h5>

                            Proposals

                        </h5>

                        <h3>

                            {{ proposal_count }}

                        </h3>

                    </div>

                </div>

            </a>

        </div>

        <div class="col-md-3">

            <a href="{{ url_for(
                'employee_sales',
                username=user.username
            ) }}"
               class="module-link">

                <div class="card module-card">

                    <div class="card-body text-center">

                        <h5>

                            Sales Pipeline

                        </h5>

                        <h3>

                            {{ sales_count }}

                        </h3>

                    </div>

                </div>

            </a>

        </div>

        <div class="col-md-3">

            <a href="{{ url_for(
                'employee_invoices',
                username=user.username
            ) }}"
               class="module-link">

                <div class="card module-card">

                    <div class="card-body text-center">

                        <h5>

                            Invoices

                        </h5>

                        <h3>

                            {{ invoice_count }}

                        </h3>

                    </div>

                </div>

            </a>

        </div>

    </div>

</div>

</body>

</html>
