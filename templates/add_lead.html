<!DOCTYPE html>
<html>

<head>

    <title>Add Lead</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Lead Management
        </h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Lead Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Lead Source / Reference
                    </label>

                    <input type="text"
                           name="reference"
                           class="form-control">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input type="text"
                           name="location"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"
                           name="phone"
                           class="form-control">

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Response
                </label>

                <textarea name="responses"
                          class="form-control"></textarea>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Date of 1st Followup
                    </label>

                    <input type="date"
                           name="date_of_1st_followup"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Next To Call
                    </label>

                    <input type="date"
                           name="next_to_call"
                           class="form-control"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Recent Remarks
                </label>

                <textarea name="recent"
                          class="form-control"></textarea>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Save Lead

                </button>

            </div>

        </form>

    </div>

    <br>

    <div class="card shadow p-4">

        <h3 class="mb-3">
            All Leads
        </h3>

        <table class="table table-bordered table-striped">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Reference</th>

                    <th>Location</th>

                    <th>Phone</th>

                    <th>Next To Call</th>

                    <th>Recent Remarks</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                {% for lead in leads %}

                <tr>

                    <td>{{ lead.lead_id }}</td>

                    <td>{{ lead.name }}</td>

                    <td>{{ lead.reference }}</td>

                    <td>{{ lead.location }}</td>

                    <td>{{ lead.phone }}</td>

                    <td>{{ lead.next_to_call }}</td>

                    <td>{{ lead.recent }}</td>

                    <td>
                        <a href="/lead/{{ lead.lead_id }}"
                            class="btn btn-dark btn-sm">
                            View
                        </a>
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
