<!DOCTYPE html>
<html>

<head>

<title>CRM Dashboard</title>

<style>

body{

    font-family:Arial,sans-serif;

    background:#f5f7fa;

    margin:0;

}

.container{

    text-align:center;

    margin-top:80px;

}

.card{

    display:inline-block;

    width:220px;

    margin:15px;

    padding:25px;

    background:white;

    border-radius:10px;

    box-shadow:0px 0px 10px rgba(0,0,0,0.1);

    text-decoration:none;

    color:#333;

    font-size:18px;

    font-weight:bold;

}

.card:hover{

    transform:scale(1.03);

}

</style>

</head>

<body>

<div class="container">

    <h1>CRM Dashboard</h1>

    <br>

    <a href="/add-lead" class="card">
        Leads
    </a>

    <a href="/add-meeting" class="card">
        Meetings
    </a>

    <a href="/add-visit" class="card">
        Visits
    </a>

    <a href="/add-drawing" class="card">
        Drawings
    </a>

    <a href="/add-proposal" class="card">
        Proposals
    </a>

    <a href="/add-sales" class="card">
        Sales
    </a>

    <a href="/add-invoice" class="card">
        Invoices
    </a>

    <a href="/add-client" class="card">
        Clients
    </a>





</div>

</body>

</html>
