<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

    Employee Productivity

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Employee Productivity

        </h2>
        <form method="GET"
              class="mb-3 mevachi-table-search">

            <div class="input-group flex-nowrap">

                <input type="text"
                       name="search"
                       value="{{ search or '' }}"
                       class="form-control"
                       placeholder="Search employee">

                <button type="submit"
                        class="btn btn-dark">

                    Search

                </button>

                <a href="{{ url_for(
                    'productivity'
                ) }}"
                   class="btn btn-secondary">

                    Clear

                </a>

            </div>

        </form>

        <table class="table table-bordered table-striped">

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Role</th>

                    <th>Today</th>

                    <th>This Week</th>

                    <th>This Month</th>

                    <th class="mv-col-actions">Action</th>

                </tr>

            </thead>

            <tbody>

                {% for user in productivity_data %}

                <tr>

                    <td>

                        {{ user.full_name }}

                    </td>

                    <td>

                        {{ user.role }}

                    </td>

                    <td>

                        {{ user.today }}

                    </td>

                    <td>

                        {{ user.week }}

                    </td>

                    <td>

                        {{ user.month }}

                    </td>

                    <td>

                        <a href="{{ url_for(
                            'employee_activity',
                            username=user.username
                        ) }}"
                           class="btn btn-dark btn-sm">

                            View Activity

                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
