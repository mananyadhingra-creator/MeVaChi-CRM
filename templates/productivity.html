<!DOCTYPE html>
<html>

<head>

<title>

    Employee Productivity

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Employee Productivity

        </h2>
        <form method="GET"
              class="mb-3">

            <div class="input-group">

                <input type="text"
                       name="search"
                       value="{{ search or '' }}"
                       class="form-control"
                       placeholder="Search employee">

                <button type="submit"
                        class="btn btn-dark">

                    Search

                </button>

                <a href="{{ url_for(
                    'productivity'
                ) }}"
                   class="btn btn-secondary">

                    Clear

                </a>

            </div>

        </form>

        <table class="table table-bordered table-striped">

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Role</th>

                    <th>Today</th>

                    <th>This Week</th>

                    <th>This Month</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                {% for user in productivity_data %}

                <tr>

                    <td>

                        {{ user.full_name }}

                    </td>

                    <td>

                        {{ user.role }}

                    </td>

                    <td>

                        {{ user.today }}

                    </td>

                    <td>

                        {{ user.week }}

                    </td>

                    <td>

                        {{ user.month }}

                    </td>

                    <td>

                        <a href="{{ url_for(
                            'employee_activity',
                            username=user.username
                        ) }}"
                           class="btn btn-dark btn-sm">

                            View Activity

                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
