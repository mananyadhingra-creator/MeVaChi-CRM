<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Edit Client

        </h2>

        <form method="POST">

            <!-- SELECT PROPOSAL & INVOICE -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Select Records

                </h4>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Proposal

                        </label>

                        <select name="proposal_id">


                            <option value="">

                                Select Proposal

                            </option>

                            {% for proposal in proposals %}

                            <option

                                value="{{ proposal.proposal_id }}"

                                data-name="{{ proposal.name }}"

                                data-address="{{ proposal.site_address }}"

                                data-email="{{ proposal.email }}"

                                data-phone="{{ proposal.phone_no_client }}"

                                data-state="{{ proposal.state }}"
                                {% if client.proposal_id == proposal.proposal_id %}

                                    selected

                                {% endif %}>

                                {{ proposal.reference_no }}
                                -
                                {{ proposal.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Invoice

                        </label>

                        <select name="invoice_id">

                            <option value="">

                                Select Invoice

                            </option>

                            {% for invoice in invoices %}

                            <option

                                value="{{ invoice.invoice_id }}"

                                data-product="{{ invoice.product_sold }}"

                                data-units="{{ invoice.total_units }}"
                                {% if client.invoice_id == invoice.invoice_id %}

                                    selected

                                {% endif %}>

                                {{ invoice.invoice_no }}
                                -
                                {{ invoice.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

            </div>

            <!-- BASIC CLIENT INFORMATION -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Basic Client Information

                </h4>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Client Name

                        </label>

                        <input type="text"
                               id="client_name"
                               name="client_name"
                               value="{{ client.client_name }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Monitor Present

                        </label>

                        <select name="monitor_present"
                                class="form-select">

                            <option value="YES"{% if client.monitor_present == "YES" %} selected{% endif %}>

                                YES

                            </option>

                            <option value="NO"{% if client.monitor_present == "NO" %} selected{% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Property Type

                        </label>

                        <select name="property_type"
                                class="form-select">

                            <option value="Residential"{% if client.property_type == "Residential" %} selected{% endif %}>

                                Residential

                            </option>

                            <option value="Office/Commercial Space"{% if client.property_type == "Office/Commercial Space" %} selected{% endif %}>

                                Office/Commercial Space

                            </option>

                            <option value="School/University"{% if client.property_type == "School/University" %} selected{% endif %}>

                                School/University

                            </option>

                            <option value="Farmhouse"{% if client.property_type == "Farmhouse" %} selected{% endif %}>

                                Farmhouse

                            </option>

                            <option value="Others"{% if client.property_type == "Others" %} selected{% endif %}>

                                Others

                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            State

                        </label>

                        <input type="text"
                               id="state"
                               name="state"
                               value="{{ client.state }}"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Address

                    </label>

                    <textarea id="address"
                              name="address"
                              rows="3"
                              class="form-control">{{ client.address }}</textarea>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Email ID

                        </label>

                        <input type="email"
                               id="mail_id"
                               name="mail_id"
                               value="{{ client.email }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Mobile Number

                        </label>

                        <input type="text"
                               id="mobile_no"
                               name="mobile_no"
                               value="{{ client.mobile_no }}"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Location Link

                    </label>

                    <input type="text"
                           name="location_link"
                           value="{{ client.location_link }}"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Nearest Metro Station

                    </label>

                    <input type="text"
                           name="nearest_metrostation"
                           value="{{ client.nearest_metrostation }}"
                           class="form-control">

                </div>

            </div>

                        <!-- INSTALLATION INFORMATION -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Installation Information

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Product

                        </label>

                        <input type="text"
                               id="product"
                               name="product"
                               value="{{ client.product }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Installation Date

                        </label>

                        <input type="date"
                               name="installation_date"
                               value="{{ client.installation_date }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Activation Date

                        </label>

                        <input type="date"
                               name="activation_date"
                               value="{{ client.activation_date }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Filter Colour

                        </label>

                        <select name="filter_colour"
                                class="form-select">

                            <option value="MERV-15 (Black)" {% if client.filter_colour == "MERV-15 (Black)" %} selected {% endif %}>
                                MERV-15 (Black)
                            </option>

                            <option value="MERV-16 (White)" {% if client.filter_colour == "MERV-16 (White)" %} selected {% endif %}>
                                MERV-16 (White)
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            No Of Units Installed

                        </label>

                        <input type="number"
                               id="no_of_units_installed"
                               name="no_of_units_installed"
                               value="{{ client.no_of_units_installed }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Solution Working

                        </label>

                        <select name="solution_working"
                                class="form-select">

                            <option value="YES" {% if client.solution_working == "YES" %} selected {% endif %}>

                                YES

                            </option>

                            <option value="NO" {% if client.solution_working == "NO" %} selected {% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- CMC INFORMATION -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    CMC Information

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            CMC Applicable

                        </label>

                        <select name="cmc_applicable"
                                class="form-select">

                            <option value="YES" {% if client.cmc_applicable == "YES" %} selected {% endif %}>

                                YES

                            </option>

                            <option value="NO" {% if client.cmc_applicable == "NO" %} selected {% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Next CMC Renewal Date

                        </label>

                        <input type="date"
                               name="next_cmc_renewal_date"
                               value="{{ client.next_cmc_renewal_date }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            CMC Amount

                        </label>

                        <input type="number"
                               step="0.01"
                               name="cmc_amount"
                               value="{{ client.cmc_amount }}"
                               class="form-control">

                    </div>

                </div>

            </div>

            <!-- SERVICE INFORMATION -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Service Information

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Last Service Date

                        </label>

                        <input type="date"
                               name="last_service_date"
                               value="{{ client.last_service_date }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Service Interval Days

                        </label>

                        <input type="number"
                               name="service_interval_days"
                               value="{{ client.service_interval_days }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Filter Clean

                        </label>

                        <select name="filter_clean"
                                class="form-select">

                            <option value="YES" {% if client.filter_clean == "YES" %} selected {% endif %}>

                                YES

                            </option>

                            <option value="NO" {% if client.filter_clean == "NO" %} selected {% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Service For

                        </label>

                        <input type="text"
                               name="service_for"
                               value="{{ client.service_for }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            No Of Filters Replaced

                        </label>

                        <input type="number"
                               name="no_of_filters_replaced"
                               value="{{ client.no_of_filters_replaced }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Pre Service Message

                        </label>

                        <select name="pre_service_msg"
                                class="form-select">

                            <option value="YES" {% if client.pre_service_msg == "YES" %} selected {% endif %}>

                                YES

                            </option>

                            <option value="NO" {% if client.pre_service_msg == "NO" %} selected {% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Post Service Message

                        </label>

                        <select name="post_service_msg"
                                class="form-select">

                            <option value="YES" {% if client.post_service_msg == "YES" %} selected {% endif %}>

                                YES

                            </option>

                            <option value="NO" {% if client.post_service_msg == "NO" %} selected {% endif %}>
                                NO

                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- REMARKS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Remarks

                </h4>

                <textarea name="remark"
                          rows="4"
                          class="form-control">{{ client.remark }}</textarea>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark btn-lg">

                    Update Client

                </button>


            </div>

        </form>

    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
