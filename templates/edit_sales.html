<!DOCTYPE html>
<html>

<head>

    <title>Sales Pipeline Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Update Sales Record

        </h2>

        <form method="POST">

            <!-- SELECT PROPOSAL -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Select Proposal

                </h4>

                <select name="proposal_id">

                    <option value="">
                        Select Proposal
                    </option>

                    {% for proposal in proposals %}

                    <option

                        value="{{ proposal.proposal_id }}"

                        data-name="{{ proposal.name }}"

                        data-reference="{{ proposal.reference_no }}"

                        data-source="{{ proposal.source }}"

                        data-address="{{ proposal.site_address }}"

                        data-phone="{{ proposal.phone_no_client }}"

                        data-email="{{ proposal.email }}"

                        {% if proposal.proposal_id == sales.proposal_id %}
                            selected
                        {% endif %}>

                        {{ proposal.reference_no }}
                        -
                        {{ proposal.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- CLIENT DETAILS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Client Details

                </h4>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Name

                        </label>

                        <input type="text"
                               id="name"
                               name="name"
                               value="{{ sales.name }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Reference No

                        </label>

                        <input type="text"
                               id="reference_no"
                               name="reference_no"
                               value="{{ sales.reference_no }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Source

                        </label>

                        <input type="text"
                               id="source"
                               name="source"
                               value="{{ sales.source }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Contact Number

                        </label>

                        <input type="text"
                               id="contact_no"
                               name="contact_no"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email ID

                    </label>

                    <input type="email"
                           id="email_id"
                           name="email_id"
                           value="{{ sales.email }}"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Address

                    </label>

                    <textarea id="address"
                              name="address"
                              rows="3"
                              class="form-control">{{ sales.address }}</textarea>

                </div>

            </div>

            <!-- PROJECT DETAILS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Project Details

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Project Stage

                        </label>

                        <select name="project_stage"
                                class="form-select">
                            <option value="Lead Generation" {% if sales.project_stage == "Lead Generation" %}selected{% endif %}>Lead Generation</option>
                            <option value="Site Visit" {% if sales.project_stage == "Site Visit" %}selected{% endif %}>Site Visit</option>
                            <option value="Proposal & Visit" {% if sales.project_stage == "Proposal & Visit" %}selected{% endif %}>Proposal & Visit</option>
                            <option value="Order Confirmation" {% if sales.project_stage == "Order Confirmation" %}selected{% endif %}>Order Confirmation</option>
                            <option value="Installation" {% if sales.project_stage == "Installation" %}selected{% endif %}>Installation</option>
                            <option value="Lost" {% if sales.project_stage == "Lost" %}selected{% endif %}>Lost</option>
                            <option value="PO Received" {% if sales.project_stage == "PO Received" %}selected{% endif %}>PO Received</option>
                            <option value="Advance Received" {% if sales.project_stage == "Advance Received" %}selected{% endif %}>Advance Received</option>
                            <option value="Piping" {% if sales.project_stage == "Piping" %}selected{% endif %}>Piping</option>
                            <option value="Cold" {% if sales.project_stage == "Cold" %}selected{% endif %}>Cold</option>
                            <option value="Completed" {% if sales.project_stage == "Completed" %}selected{% endif %}>Completed</option>
                            <option value="Withdrawn by MVC" {% if sales.project_stage == "Withdrawn by MVC" %}selected{% endif %}>Withdrawn by MVC</option>
                            <option value="Drawings" {% if sales.project_stage == "Drawings" %}selected{% endif %}>Drawings</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            MOC

                        </label>

                        <input type="text"
                               name="moc"
                               value="{{ sales.moc }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Sales Person

                        </label>

                        <input type="text"
                               name="sales_person"
                               value="{{ sales.sales_person }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Project Type

                        </label>

                        <input type="text"
                               name="project_type"
                               value="{{ sales.project_type }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Category

                        </label>

                        <input type="text"
                               name="category"
                               value="{{ sales.category }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Site Incharge

                        </label>

                        <input type="text"
                               name="site_incharge"
                               value="{{ sales.site_incharge }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Site Incharge Contact

                        </label>

                        <input type="text"
                               name="site_incharge_contact"
                               value="{{ sales.site_incharge_contact }}"
                               class="form-control">

                    </div>

                </div>
                <div class="row">

                    <div class="col-md-4 mb-3">
                        
                        <label class="form-label">

                            First Contact

                        </label>

                        <input type="date"
                               name="first_contact"
                               value="{{ sales.first_contact }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Last Contact

                        </label>

                        <input type="date"
                               name="last_contact"
                               value="{{ sales.last_contact }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Followup Date

                        </label>

                        <input type="date"
                               name="followup_date"
                               value="{{ sales.followup_date }}"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Next Action

                    </label>

                    <textarea name="next_action"
                              rows="3"
                              class="form-control">{{ sales.next_action }}</textarea>

                </div>

            </div>
                        <!-- REVENUE DETAILS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Revenue Details

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            No Of Site Visits

                        </label>

                        <input type="number"
                               name="no_of_site_visits"
                               value="{{ sales.no_of_site_visits }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Area Covered

                        </label>

                        <input type="number"
                               step="0.01"
                               name="area_covered"
                               value="{{ sales.area_covered }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Total Units

                        </label>

                        <input type="number"
                               name="total_units"
                               value="{{ sales.total_units }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Price Of Units

                        </label>

                        <input type="number"
                               step="0.01"
                               id="price_of_units"
                               name="price_of_units"
                               value="{{ sales.price_of_units }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            First Year CMC

                        </label>

                        <input type="number"
                               step="0.01"
                               id="first_year_cmc"
                               name="first_year_cmc"
                               value="{{ sales.first_year_cmc }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Installation

                        </label>

                        <input type="number"
                               step="0.01"
                               id="installation"
                               name="installation"
                               value="{{ sales.installation }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Total Sensor

                        </label>

                        <input type="number"
                               id="total_sensor"
                               name="total_sensor"
                               value="{{ sales.total_sensor }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Sensor Cost

                        </label>

                        <input type="number"
                               step="0.01"
                               id="sensor_cost"
                               name="sensor_cost"
                               value="{{ sales.sensor_cost }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Discount

                        </label>

                        <input type="number"
                               step="0.01"
                               id="discount"
                               name="discount"
                               value="{{ sales.discount }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Revenue

                        </label>

                        <input type="number"
                               step="0.01"
                               id="revenue"
                               name="revenue"
                               value="{{ sales.revenue }}"
                               readonly
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Amount Received

                        </label>

                        <input type="number"
                               step="0.01"
                               id="amount_received"
                               name="amount_received"
                               value="{{ sales.amount_received }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Amount Due

                        </label>

                        <input type="number"
                               step="0.01"
                               id="amount_due"
                               name="amount_due"
                               value="{{ sales.amount_due }}"
                               readonly
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Total Revenue

                        </label>

                        <input type="number"
                               step="0.01"
                               id="total_revenue"
                               name="total_revenue"
                               value="{{ sales.total_revenue }}"
                               readonly
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            GST No

                        </label>

                        <input type="text"
                               name="gst_no"
                               value="{{ sales.gst_no }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            CMC Onwards

                        </label>

                        <input type="number"
                               step="0.01"
                               value="{{ sales.cmc_onwards }}"
                               name="cmc_onwards"
                               class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Total CMC

                    </label>

                    <input type="number"
                           step="0.01"
                           value="{{ sales.total_cmc }}"
                           name="total_cmc"
                           class="form-control">

                </div>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark btn-lg">

                    Update Sales Record

                </button>

                <a href="/dashboard"
                   class="btn btn-secondary btn-lg">

                    Back To Dashboard

                </a>

            </div>

        </form>

    </div>

    
    

</div>

<script>

function calculateRevenue() {

    let price =
        parseFloat(
            document.getElementById(
                'price_of_units'
            ).value
        ) || 0;

    let cmc =
        parseFloat(
            document.getElementById(
                'first_year_cmc'
            ).value
        ) || 0;

    let installation =
        parseFloat(
            document.getElementById(
                'installation'
            ).value
        ) || 0;

    let totalSensor =
        parseFloat(
            document.getElementById(
                'total_sensor'
            ).value
        ) || 0;

    let sensorCost =
        parseFloat(
            document.getElementById(
                'sensor_cost'
            ).value
        ) || 0;

    let discount =
        parseFloat(
            document.getElementById(
                'discount'
            ).value
        ) || 0;

    let amountReceived =
        parseFloat(
            document.getElementById(
                'amount_received'
            ).value
        ) || 0;

    let revenue =
        price +
        cmc +
        installation +
        (totalSensor * sensorCost) -
        discount;

    let totalRevenue =
        revenue * 1.18;

    let amountDue =
        totalRevenue -
        amountReceived;

    document.getElementById(
        'revenue'
    ).value =
        revenue.toFixed(2);

    document.getElementById(
        'total_revenue'
    ).value =
        totalRevenue.toFixed(2);

    document.getElementById(
        'amount_due'
    ).value =
        amountDue.toFixed(2);

}

document.getElementById(
    'price_of_units'
).addEventListener(
    'input',
    calculateRevenue
);

document.getElementById(
    'first_year_cmc'
).addEventListener(
    'input',
    calculateRevenue
);

document.getElementById(
    'installation'
).addEventListener(
    'input',
    calculateRevenue
);

document.getElementById(
    'total_sensor'
).addEventListener(
    'input',
    calculateRevenue
);

document.getElementById(
    'sensor_cost'
).addEventListener(
    'input',
    calculateRevenue
);

document.getElementById(
    'discount'
).addEventListener(
    'input',
    calculateRevenue
);

document.getElementById(
    'amount_received'
).addEventListener(
    'input',
    calculateRevenue
);

</script>

</body>

</html>
