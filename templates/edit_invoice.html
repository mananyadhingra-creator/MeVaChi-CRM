<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Update Invoice

        </h2>

        <form method="POST"
              enctype="multipart/form-data">



            <!-- INVOICE DETAILS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Invoice Details

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Name

                        </label>

                        <input type="text"
                               id="name"
                               name="name"
                               value="{{ invoice.name }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Date Of Invoice

                        </label>

                        <input type="date"
                               name="doi"
                               value="{{ invoice.doi }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Invoice No

                        </label>

                        <input type="text"
                               name="invoice_no"
                               value="{{ invoice.invoice_no }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            GST No

                        </label>

                        <input type="text"
                               id="gst_no"
                               name="gst_no"
                               value="{{ invoice.gst_no }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Product Sold

                        </label>

                        <select
                            name="product_sold"
                            class="form-select">

                            <option value="">
                                Select Product
                            </option>

                            <option value="Cab Unit" {% if invoice.product_sold == 'Cab Unit' %}selected{% endif %}>
                                Cab Unit
                            </option>

                            <option value="Cab Unit + Monitor" {% if invoice.product_sold == 'Cab Unit + Monitor' %}selected{% endif %}>
                                Cab Unit + Monitor
                            </option>

                            <option value="Cab Unit + Monitor + CMC" {% if invoice.product_sold == 'Cab Unit + Monitor + CMC' %}selected{% endif %}>
                                Cab Unit + Monitor + CMC
                            </option>

                            <option value="Cab Unit + Installation + CMC" {% if invoice.product_sold == 'Cab Unit + Installation + CMC' %}selected{% endif %}>
                                Cab Unit + Installation + CMC
                            </option>

                            <option value="Cab Unit + CMC" {% if invoice.product_sold == 'Cab Unit + CMC' %}selected{% endif %}>
                                Cab Unit + CMC
                            </option>

                            <option value="Cab Unit + Installation" {% if invoice.product_sold == 'Cab Unit + Installation' %}selected{% endif %}>
                                Cab Unit + Installation
                            </option>

                            <option value="Plant" {% if invoice.product_sold == 'Plant' %}selected{% endif %}>
                                Plant
                            </option>

                            <option value="Molecular Filters" {% if invoice.product_sold == 'Molecular Filters' %}selected{% endif %}>
                                Molecular Filters
                            </option>

                            <option value="Sampling Air Quality" {% if invoice.product_sold == 'Sampling Air Quality' %}selected{% endif %}>
                                Sampling Air Quality
                            </option>

                            <option value="Monitor" {% if invoice.product_sold == 'Monitor' %}selected{% endif %}>
                                Monitor
                            </option>

                            <option value="AMC" {% if invoice.product_sold == 'AMC' %}selected{% endif %}>
                                AMC
                            </option>

                            <option value="Cab Max Unit" {% if invoice.product_sold == 'Cab Max Unit' %}selected{% endif %}>
                                Cab Max Unit
                            </option>

                            <option value="TFA" {% if invoice.product_sold == 'TFA' %}selected{% endif %}>
                                TFA
                            </option>

                            <option value="Technical Services" {% if invoice.product_sold == 'Technical Services' %}selected{% endif %}>
                                Technical Services
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Current Invoice Files

                        </label>

                        <br>
                        {% if invoice.invoice_pdf %}
                        <a href="{{ url_for(
                                        'static',
                                        filename=invoice.invoice_pdf
                        ) }}"
                        target="_blank">

                            View Current Files
                        </a>
                        <br><br>
                        {% endif %}
                        <input type="file"
                               name="invoice_files"
                               class="form-control"
                               multiple>

                    </div>

                </div>

            </div>

            <!-- REVENUE INFORMATION -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Revenue Information

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Total Units

                        </label>

                        <input type="number"
                               id="total_units"
                               name="total_units"
                               value="{{ invoice.total_units }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Price Of Units

                        </label>

                        <input type="number"
                               step="0.01"
                               id="price_of_units"
                               name="price_of_units"
                               value="{{ invoice.price_of_units }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            First Year CMC

                        </label>

                        <input type="number"
                               step="0.01"
                               id="first_year_cmc"
                               name="first_year_cmc"
                               value="{{ invoice.first_year_cmc }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Installation

                        </label>

                        <input type="number"
                               step="0.01"
                               id="installation"
                               name="installation"
                               value="{{ invoice.installation }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Total Sensor

                        </label>

                        <input type="number"
                               id="total_sensor"
                               name="total_sensor"
                               value="{{ invoice.total_sensor }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Sensor Cost

                        </label>

                        <input type="number"
                               step="0.01"
                               id="sensor_cost"
                               name="sensor_cost"
                               value="{{ invoice.sensor_cost }}"
                               class="form-control">

                    </div>

                </div>
                                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Revenue

                        </label>

                        <input type="number"
                               step="0.01"
                               id="revenue"
                               name="revenue"
                               value="{{ invoice.revenue }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Total Revenue

                        </label>

                        <input type="number"
                               step="0.01"
                               id="total_revenue"
                               name="total_revenue"
                               value="{{ invoice.total_revenue }}"
                               class="form-control">

                    </div>

                </div>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark btn-lg">

                    Update Invoice

                </button>


            </div>

        </form>

    </div>

    

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
