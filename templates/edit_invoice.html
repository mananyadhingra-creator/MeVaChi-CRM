<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Update Invoice

        </h2>

        <form method="POST"
              enctype="multipart/form-data">

            <!-- SELECT SALES RECORD -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Select Sales Record

                </h4>

                <select name="sales_id">

                    <option value="">

                        Select Sales Record

                    </option>

                    {% for sale in sales %}

                    <option

                        value="{{ sale.sales_id }}"

                        data-name="{{ sale.name }}"

                        data-gst="{{ sale.gst_no }}"

                        data-units="{{ sale.total_units }}"

                        data-price="{{ sale.price_of_units }}"

                        data-cmc="{{ sale.first_year_cmc }}"

                        data-installation="{{ sale.installation }}"

                        data-sensor="{{ sale.total_sensor }}"

                        data-sensorcost="{{ sale.sensor_cost }}"

                        data-revenue="{{ sale.revenue }}"

                        data-totalrevenue="{{ sale.total_revenue }}"
                        {% if sale.sales_id == invoice.sales_id %}
                            selected
                        {% endif %}>

                        {{ sale.reference_no }}
                        -
                        {{ sale.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- INVOICE DETAILS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Invoice Details

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Name

                        </label>

                        <input type="text"
                               id="name"
                               name="name"
                               value="{{ invoice.name }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Date Of Invoice

                        </label>

                        <input type="date"
                               name="doi"
                               value="{{ invoice.doi }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Invoice No

                        </label>

                        <input type="text"
                               name="invoice_no"
                               value="{{ invoice.invoice_no }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            GST No

                        </label>

                        <input type="text"
                               id="gst_no"
                               name="gst_no"
                               value="{{ invoice.gst_no }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Product Sold

                        </label>

                        <input type="text"
                               name="product_sold"
                               value="{{ invoice.product_sold }}"
                               class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Current Invoice Files

                        </label>

                        <br>
                        {% if invoice.invoice_pdf %}
                        <a href="{{ url_for(
                                        'static',
                                        filename=invoice.invoice_pdf
                        ) }}"
                        target="_blank">

                            View Current Files
                        </a>
                        <br><br>
                        {% endif %}
                        <input type="file"
                               name="invoice_files"
                               class="form-control"
                               multiple>

                    </div>

                </div>

            </div>

            <!-- REVENUE INFORMATION -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Revenue Information

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Total Units

                        </label>

                        <input type="number"
                               id="total_units"
                               name="total_units"
                               value="{{ invoice.total_units }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Price Of Units

                        </label>

                        <input type="number"
                               step="0.01"
                               id="price_of_units"
                               name="price_of_units"
                               value="{{ invoice.price_of_units }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            First Year CMC

                        </label>

                        <input type="number"
                               step="0.01"
                               id="first_year_cmc"
                               name="first_year_cmc"
                               value="{{ invoice.first_year_cmc }}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Installation

                        </label>

                        <input type="number"
                               step="0.01"
                               id="installation"
                               name="installation"
                               value="{{ invoice.installation }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Total Sensor

                        </label>

                        <input type="number"
                               id="total_sensor"
                               name="total_sensor"
                               value="{{ invoice.total_sensor }}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Sensor Cost

                        </label>

                        <input type="number"
                               step="0.01"
                               id="sensor_cost"
                               name="sensor_cost"
                               value="{{ invoice.sensor_cost }}"
                               class="form-control">

                    </div>

                </div>
                                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Revenue

                        </label>

                        <input type="number"
                               step="0.01"
                               id="revenue"
                               name="revenue"
                               value="{{ invoice.revenue }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Total Revenue

                        </label>

                        <input type="number"
                               step="0.01"
                               id="total_revenue"
                               name="total_revenue"
                               value="{{ invoice.total_revenue }}"
                               class="form-control">

                    </div>

                </div>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark btn-lg">

                    Update Invoice

                </button>


            </div>

        </form>

    </div>

    

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
