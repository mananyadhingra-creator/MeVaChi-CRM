<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Service</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Edit Service

        </h2>

        <!-- CLIENT INFO -->

        <div class="card shadow-sm p-3 mb-4">

            <h4>

                Client Information

            </h4>

            <div class="row">

                <div class="col-md-4">

                    <strong>

                        Client Name

                    </strong>

                    <br>

                    {{ client.client_name }}

                </div>

                <div class="col-md-4">

                    <strong>

                        Product

                    </strong>

                    <br>

                    {{ client.product }}

                </div>

                <div class="col-md-4">

                    <strong>

                        Mobile

                    </strong>

                    <br>

                    {{ client.mobile_no }}

                </div>

            </div>

        </div>

        <form method="POST">

            <!-- SERVICE DETAILS -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Service Details

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Service Date

                        </label>

                        <input type="date"
                               name="service_date"
                               value="{{service.service_date}}"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Service Of

                        </label>

                        <input type="text"
                               name="service_of"
                               value="{{service.service_of}}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Serviced By

                        </label>

                        <input type="text"
                               name="serviced_by"
                               value="{{service.serviced_by}}"
                               class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            No of Filters Replaced

                        </label>

                        <input type="number"
                               name="no_of_filters"
                               value="{{service.no_of_filters}}"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            No of Filters Cleaned

                        </label>

                        <input
                            type="number"
                            name="no_of_filters_cleaned"
                            value="{{ service.no_of_filters_cleaned }}"
                            class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Controller Changed

                        </label>

                        <select name="controller_changed"
                                class="form-select">

                            <option value="YES"
                                {% if service.controller_changed == 'YES' %}
                                    selected
                                {% endif %}>

                                YES

                            </option>

                            <option value="NO"
                                {% if service.controller_changed == 'NO' %}
                                    selected
                                {% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Fan Changed

                        </label>

                        <select name="fan_changed"
                                class="form-select">

                            <option value="YES"
                                {% if service.fan_changed == 'YES' %}
                                    selected
                                {% endif %}>

                                YES

                            </option>

                            <option value="NO"
                                {% if service.fan_changed == 'NO' %}
                                    selected
                                {% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- COMMUNICATION -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Communication

                </h4>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Pre Service Message

                        </label>

                        <select name="pre_service_msgd"
                                class="form-select">

                            <option value="YES"
                                {% if service.pre_service_msgd == 'YES' %}
                                    selected
                                {% endif %}>

                                YES

                            </option>

                            <option value="NO"
                                {% if service.pre_service_msgd == 'NO' %}
                                    selected
                                {% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Post Service Report Sent

                        </label>

                        <select name="post_service_report_sent"
                                class="form-select">

                            <option value="YES"
                                {% if service.post_service_report_sent == 'YES' %}
                                    selected
                                {% endif %}>

                                YES

                            </option>

                            <option value="NO"
                                {% if service.post_service_report_sent == 'NO' %}
                                    selected
                                {% endif %}>

                                NO

                            </option>

                        </select>

                    </div>

                    

                </div>

            </div>

            <!-- CUSTOMER ENGAGEMENT -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Customer Engagement

                </h4>

                <div class="mb-3">

                    <label class="form-label">

                        Miscellaneous Messages

                    </label>

                    <textarea name="miscellaneous_messages"
                              rows="3"
                              class="form-control">{{ service.miscellaneous_messages }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Tips And Tricks

                    </label>

                    <textarea name="tips_and_tricks"
                              rows="3"
                              class="form-control">{{ service.tips_and_tricks }}</textarea>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Referrals Program

                        </label>

                        <input type="text"
                               name="referrals_program"
                               value="{{service.referrals_program}}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            News Sent

                        </label>

                        <select name="news_sent"
                                class="form-select">

                            <option value="YES"
                                {% if service.news_sent == 'YES' %}
                                    selected
                                {% endif %}>

                                YES

                            </option>

                            <option value="NO"
                                {% if service.news_sent == 'NO' %}
                                    selected
                                {% endif %}>

                                NO

                            </option>

                        </select>



                    </div>

                </div>

            </div>

            <!-- REMARK -->

            <div class="card shadow-sm p-4 mb-4">

                <h4>

                    Remark

                </h4>

                <textarea name="remark"
                          rows="4"
                          class="form-control">{{ service.remark }}</textarea>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark btn-lg">

                    Update Service

                </button>


            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
