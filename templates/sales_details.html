<!DOCTYPE html>
<html>

<head>

    <title>Sales Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">

        Sales Details

    </h2>

    <!-- CLIENT DETAILS -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Client Details

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Sales ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.sales_id }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Name

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.name }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Reference No

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.reference_no }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Source

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.source }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Contact Number

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.contact_no }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Email ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.email_id }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Address

            </label>

            <textarea class="form-control"
                      rows="3"
                      readonly>{{ sale.address }}</textarea>

        </div>

    </div>

    <!-- PROJECT DETAILS -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Project Details

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Project Stage

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.project_stage }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    MOC

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.moc }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Sales Person

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.sales_person }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Project Type

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.project_type }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Category

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.category }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Site Incharge

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.site_incharge }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Site Incharge Contact

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.site_incharge_contact }}"
                       readonly>

            </div>

        </div>
                <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    First Contact

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.first_contact }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Last Contact

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.last_contact }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Followup Date

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.followup_date }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Next Action

            </label>

            <textarea class="form-control"
                      rows="3"
                      readonly>{{ sale.next_action }}</textarea>

        </div>

    </div>

    <!-- REVENUE DETAILS -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Revenue Details

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    No Of Site Visits

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.no_of_site_visits }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Area Covered

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.area_covered }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Units

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.total_units }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Price Of Units

                </label>
                                <input type="text"
                       class="form-control"
                       value="{{ sale.price_of_units }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    First Year CMC

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.first_year_cmc }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Installation

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.installation }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Sensor

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.total_sensor }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Sensor Cost

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.sensor_cost }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Discount

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.discount }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Revenue

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.revenue }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Amount Received

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.amount_received }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Amount Due

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.amount_due }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Revenue

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.total_revenue }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    GST No

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.gst_no }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    CMC Onwards

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.cmc_onwards }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Total CMC

            </label>

            <input type="text"
                   class="form-control"
                   value="{{ sale.total_cmc }}"
                   readonly>

        </div>

    </div>

    <div class="text-center mb-5">

        <a href="/add-sales"
           class="btn btn-dark">

            Back To Sales

        </a>
        <a href="/dashboard"
           class="btn btn-secondary">

            Back To Dashboard

        </a>

    </div>

</div>

</body>

</html>
