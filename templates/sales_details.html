<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>   
    <h2 class="text-center mb-4">

        Sales Details

    </h2>

    <!-- CLIENT DETAILS -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Client Details

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Sales ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.sales_id }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Name

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.name }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Reference No

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.reference_no }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Source

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.source }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Contact Number

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.contact_no }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Email ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.email_id }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Address

            </label>

            <textarea class="form-control"
                      rows="3"
                      readonly>{{ sale.address }}</textarea>

        </div>

    </div>

    <!-- PROJECT DETAILS -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Project Details

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Project Stage

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.project_stage }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    MOC

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.moc }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Sales Person

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.sales_person }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Project Type

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.project_type }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Category

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.category }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Site Incharge

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.site_incharge }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Site Incharge Contact

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.site_incharge_contact }}"
                       readonly>

            </div>

        </div>
                <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    First Contact

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.first_contact }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Last Contact

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.last_contact }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Followup Date

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.followup_date }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Next Action

            </label>

            <textarea class="form-control"
                      rows="3"
                      readonly>{{ sale.next_action }}</textarea>

        </div>

    </div>

    <!-- REVENUE DETAILS -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Revenue Details

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    No Of Site Visits

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.no_of_site_visits }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Area Covered

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.area_covered }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Units

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.total_units }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Price Of Units

                </label>
                                <input type="text"
                       class="form-control"
                       value="{{ sale.price_of_units }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    First Year CMC

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.first_year_cmc }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Installation

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.installation }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Sensor

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.total_sensor }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Sensor Cost

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.sensor_cost }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Discount

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.discount }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Revenue

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.revenue }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Amount Received

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.amount_received }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Amount Due

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.amount_due }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Total Revenue

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.total_revenue }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    GST No

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.gst_no }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    CMC Onwards

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ sale.cmc_onwards }}"
                       readonly>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Total CMC

            </label>

            <input type="text"
                   class="form-control"
                   value="{{ sale.total_cmc }}"
                   readonly>

        </div>

    </div>

    <br>

    <div class="mevachi-generator-actions">

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#advanceReceiptModal">
        <i class="bi bi-receipt-cutoff me-1"></i> Generate Advance Receipt
    </button>

    </div>

</div>

<div class="modal fade" id="advanceReceiptModal" tabindex="-1" aria-labelledby="advanceReceiptModalLabel" aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">

                        Generate Advance Receipt

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                    </button>

                </div>

                <form
                    method="GET"
                    action="{{ url_for(

                        'generate_advance_receipt',

                        sales_id=sale.sales_id

                    ) }}">

                    <div class="modal-body">

                        <div class="mb-3">

                            <label class="form-label">

                                Receipt Number

                            </label>

                            <input
                                type="text"
                                name="receipt_no"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Receipt Date

                            </label>

                            <input
                                type="date"
                                name="receipt_date"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                HSN Code

                            </label>

                            <input
                                type="text"
                                name="hsn_code"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancel

                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Generate

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>
</body>

</html>
