<!DOCTYPE html>
<html>

<head>

    <title>Service Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-1">
        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>
        <a href="/dashboard"
           class="btn btn-dark">

            Back To Dashboard

        </a>  
    </div>    
    <h2 class="text-center mb-4">

        Service Details

    </h2>

    <!-- SERVICE INFORMATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Service Information

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Service ID

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.card_id }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Service Date

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.service_date }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Serviced By

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.serviced_by }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Service Of

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.service_of }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    No Of Filters

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.no_of_filters }}"
                       readonly>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Controller Changed

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.controller_changed }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Fan Changed

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.fan_changed }}"
                       readonly>

            </div>

        </div>

    </div>

    <!-- COMMUNICATION -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Communication

        </h4>

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Pre Service Message

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.pre_service_msgd }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Post Service Report Sent

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.post_service_report_sent }}"
                       readonly>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Communication Date

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.communication_date }}"
                       readonly>

            </div>

        </div>

    </div>

    <!-- CUSTOMER ENGAGEMENT -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Customer Engagement

        </h4>

        <div class="mb-3">

            <label class="form-label">

                Miscellaneous Messages

            </label>

            <textarea class="form-control"
                      rows="3"
                      readonly>{{ service.miscellaneous_messages }}</textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Tips And Tricks

            </label>

            <textarea class="form-control"
                      rows="3"
                      readonly>{{ service.tips_and_tricks }}</textarea>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Referrals Program

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.referrals_program }}"
                       readonly>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    News Sent

                </label>

                <input type="text"
                       class="form-control"
                       value="{{ service.news_sent }}"
                       readonly>

            </div>

        </div>

    </div>

    <!-- REMARK -->

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-3">

            Remark

        </h4>

        <textarea class="form-control"
                  rows="4"
                  readonly>{{ service.remark }}</textarea>

    </div>

    <div class="text-center mb-5">

        <a href="/client-services/{{ service.client_id }}"
           class="btn btn-dark">

            Back To Service History

        </a>


    </div>

</div>

</body>

</html>
