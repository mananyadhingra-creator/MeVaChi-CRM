<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

    Change Password

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mevachi-crm.css') }}">

</head>

<body class="mevachi-app">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-2 mb-3 mevachi-page-nav">

        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>

        <a href="/dashboard"
           class="btn btn-dark">

            Back to Dashboard

        </a>

    </div>  
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Change Password

        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    New Password

                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        name="new_password"
                        class="form-control"
                        required>

                    <i
                        class="bi bi-eye password-toggle"
                        onclick="togglePassword('newPassword', this)">
                    </i>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Confirm Password

                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        class="form-control"
                        required>

                    <i
                        class="bi bi-eye password-toggle"
                        onclick="togglePassword('confirmPassword', this)">
                    </i>

                </div>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Update Password

                </button>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/mevachi-ui.js') }}"></script>

</body>

</html>
