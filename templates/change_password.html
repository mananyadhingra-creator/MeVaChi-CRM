<!DOCTYPE html>
<html>

<head>

<title>

    Change Password

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-end gap-1">
        <a href="javascript:history.back()"
           class="btn btn-outline-secondary">

            Back

        </a>
        <a href="/dashboard"
           class="btn btn-dark">

            Back To Dashboard

        </a>  
    </div>  
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Change Password

        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    New Password

                </label>

                <input type="password"
                       name="new_password"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Confirm Password

                </label>

                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       required>

            </div>

            <div class="text-center">

                <button type="submit"
                        class="btn btn-dark">

                    Update Password

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
