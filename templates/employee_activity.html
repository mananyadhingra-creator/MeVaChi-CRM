<!DOCTYPE html>
<html>

<head>

<title>

    Employee Activity

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <a href="/dashboard"
        class="btn btn-secondary mb-3">

        Back To Dashboard

    </a>
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            {{ username }}'s activity

        </h2>
        <form method="GET"
              class="mb-3">

            <div class="input-group">

                <input type="text"
                       name="search"
                       value="{{ search or '' }}"
                       class="form-control"
                       placeholder="Search activity">

                <button type="submit"
                        class="btn btn-dark">

                    Search

                </button>

                <a href="{{ url_for(
                    'productivity'
                ) }}"
                   class="btn btn-secondary">

                    Clear

                </a>

            </div>

        </form>
        <table class="table table-bordered table-striped">

            <thead>

                <tr>

                    <th>Module</th>

                    <th>Record ID</th>

                    <th>Action</th>

                    <th>Details</th>

                    <th>Date & Time</th>

                </tr>

            </thead>

            <tbody>

                {% for log in logs %}

                <tr>

                    <td>{{ log.module_name }}</td>

                    <td>{{ log.record_id }}</td>

                    <td>{{ log.action }}</td>

                    <td>{{ log.details }}</td>

                    <td>{{ log.performed_on }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

    <div class="mb-5">

        <a href="/productivity"
           class="btn btn-dark">

            Back 

        </a>


    </div>    

</div>

</body>

</html>
